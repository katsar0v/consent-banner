name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated tag, main provenance, and plugin version
        run: |
          git fetch origin main:refs/remotes/origin/main
          bash bin/verify-release-provenance.sh "${GITHUB_REF_NAME}"
          bash bin/verify-release-version.sh "${GITHUB_REF_NAME}"
      - name: Build release artifact
        run: bash bin/create-release.sh
      - name: Write checksum
        run: cd dist && sha256sum consent-banner-*.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/consent-banner-*.zip dist/SHA256SUMS --generate-notes --title "Consent Banner ${GITHUB_REF_NAME}"
