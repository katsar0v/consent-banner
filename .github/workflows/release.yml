name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated tag, main provenance, and plugin version
        run: |
          git fetch origin main:refs/remotes/origin/main
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse origin/main)"
          version="$(sed -n "s/^define( 'KDCONSENT_PLUGIN_VERSION', '\([^']*\)' );/\1/p" consent-banner.php)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build release artifact
        run: bash bin/create-release.sh
      - name: Write checksum
        run: cd dist && sha256sum consent-banner-*.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/consent-banner-*.zip dist/SHA256SUMS --generate-notes --title "Consent Banner ${GITHUB_REF_NAME}"
