name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag matches plugin version
        run: |
          version="$(sed -n "s/^define( 'KDCONSENT_PLUGIN_VERSION', '\([^']*\)' );/\1/p" consent-banner.php)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build release artifact
        run: bash bin/create-release.sh
      - name: Write checksum
        run: sha256sum dist/consent-banner-*.zip > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/consent-banner-*.zip dist/SHA256SUMS --generate-notes --title "Consent Banner ${GITHUB_REF_NAME}"
